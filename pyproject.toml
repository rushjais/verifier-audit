[project]
name = "vaudit"
version = "0.1.0"
description = "Measure whether a grader is fair and deterministic, not just un-gameable."
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40", "evalplus>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaudit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["slow: hits the real sandbox repeatedly"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
